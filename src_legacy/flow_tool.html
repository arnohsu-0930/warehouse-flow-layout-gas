<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式平面圖標註工具 (含多向文字正向箭頭)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .toolbar {
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        .canvas-container-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
            background-color: #e5e7eb;
        }
        .canvas-container {
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background-color: white;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-secondary { background-color: #f3f4f6; color: #374151; border-color: #d1d5db; }
        .btn-secondary:hover { background-color: #e5e7eb; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .btn-outline { background-color: transparent; border-color: #3b82f6; color: #3b82f6; }
        .btn-outline:hover { background-color: #eff6ff; }
        
        /* 箭頭顏色類別 */
        .btn-blue { background-color: #ebf5ff; color: #1e40af; border-color: #bfdbfe; }
        .btn-blue:hover { background-color: #dbeafe; }
        .btn-green { background-color: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .btn-green:hover { background-color: #dcfce7; }
        .btn-red { background-color: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .btn-red:hover { background-color: #fee2e2; }
    </style>
</head>
<body>
    <header class="toolbar p-4 flex flex-wrap gap-4 items-start justify-between">
        <div>
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                動線規劃工具 (多向擴充版)
            </h1>
            <p class="text-xs text-blue-600 mt-1 font-bold" id="status-text">⏳ 正在載入底圖...</p>
        </div>

        <div class="flex flex-wrap gap-3 items-start">
            
            <div class="flex flex-col gap-1 border-r pr-3 border-gray-300 h-full">
                <span class="text-[10px] text-gray-500 font-bold tracking-wider uppercase mb-1">基礎工具</span>
                <div class="grid grid-cols-2 gap-1">
                    <button onclick="setMode('text')" class="btn btn-secondary text-xs px-2 py-1" title="新增文字標籤">📝 標籤</button>
                    <button onclick="setMode('legend')" class="btn btn-secondary text-xs px-2 py-1" title="新增或重置圖例說明">📋 圖例</button>
                    <button onclick="setMode('rect')" class="btn btn-secondary text-xs px-2 py-1" title="新增白色方形來蓋住底圖">⬜ 方形</button>
                    <button onclick="setMode('circle')" class="btn btn-secondary text-xs px-2 py-1" title="新增白色圓形來蓋住底圖">⚪ 圓形</button>
                </div>
                <label class="btn btn-outline cursor-pointer text-xs px-2 py-1 mt-1 text-center" title="手動上傳底圖">
                    📂 更換底圖<input type="file" id="bg-upload" accept="image/*" class="hidden">
                </label>
            </div>
            
            <div class="flex gap-3 border-r pr-3 border-gray-300">
                <!-- 人流 (藍色) -->
                <div class="flex flex-col gap-1">
                    <span class="text-[10px] text-blue-700 font-bold mb-1">P 人流</span>
                    <div class="grid grid-cols-3 gap-1">
                        <button onclick="setMode('arrow', {color: '#3b82f6', label: 'P', dir: 'left'})" class="btn btn-blue text-xs" title="向左">⬅</button>
                        <button onclick="setMode('arrow', {color: '#3b82f6', label: 'P', dir: 'right'})" class="btn btn-blue text-xs" title="向右">➔</button>
                        <button onclick="setMode('arrow', {color: '#3b82f6', label: 'P', dir: 'double-h'})" class="btn btn-blue text-xs" title="雙向(橫)">↔</button>
                        <button onclick="setMode('arrow', {color: '#3b82f6', label: 'P', dir: 'up'})" class="btn btn-blue text-xs" title="向上">⬆</button>
                        <button onclick="setMode('arrow', {color: '#3b82f6', label: 'P', dir: 'down'})" class="btn btn-blue text-xs" title="向下">⬇</button>
                        <button onclick="setMode('arrow', {color: '#3b82f6', label: 'P', dir: 'double-v'})" class="btn btn-blue text-xs" title="雙向(直)">↕</button>
                    </div>
                </div>
                <!-- 物流 (綠色) -->
                <div class="flex flex-col gap-1">
                    <span class="text-[10px] text-green-700 font-bold mb-1">M 物流</span>
                    <div class="grid grid-cols-3 gap-1">
                        <button onclick="setMode('arrow', {color: '#22c55e', label: 'M', dir: 'left'})" class="btn btn-green text-xs" title="向左">⬅</button>
                        <button onclick="setMode('arrow', {color: '#22c55e', label: 'M', dir: 'right'})" class="btn btn-green text-xs" title="向右">➔</button>
                        <button onclick="setMode('arrow', {color: '#22c55e', label: 'M', dir: 'double-h'})" class="btn btn-green text-xs" title="雙向(橫)">↔</button>
                        <button onclick="setMode('arrow', {color: '#22c55e', label: 'M', dir: 'up'})" class="btn btn-green text-xs" title="向上">⬆</button>
                        <button onclick="setMode('arrow', {color: '#22c55e', label: 'M', dir: 'down'})" class="btn btn-green text-xs" title="向下">⬇</button>
                        <button onclick="setMode('arrow', {color: '#22c55e', label: 'M', dir: 'double-v'})" class="btn btn-green text-xs" title="雙向(直)">↕</button>
                    </div>
                </div>
                <!-- 廢棄物 (紅色) -->
                <div class="flex flex-col gap-1">
                    <span class="text-[10px] text-red-700 font-bold mb-1">W 廢棄物</span>
                    <div class="grid grid-cols-3 gap-1">
                        <button onclick="setMode('arrow', {color: '#ef4444', label: 'W', dir: 'left'})" class="btn btn-red text-xs" title="向左">⬅</button>
                        <button onclick="setMode('arrow', {color: '#ef4444', label: 'W', dir: 'right'})" class="btn btn-red text-xs" title="向右">➔</button>
                        <button onclick="setMode('arrow', {color: '#ef4444', label: 'W', dir: 'double-h'})" class="btn btn-red text-xs" title="雙向(橫)">↔</button>
                        <button onclick="setMode('arrow', {color: '#ef4444', label: 'W', dir: 'up'})" class="btn btn-red text-xs" title="向上">⬆</button>
                        <button onclick="setMode('arrow', {color: '#ef4444', label: 'W', dir: 'down'})" class="btn btn-red text-xs" title="向下">⬇</button>
                        <button onclick="setMode('arrow', {color: '#ef4444', label: 'W', dir: 'double-v'})" class="btn btn-red text-xs" title="雙向(直)">↕</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-gray-500 font-bold uppercase mb-1">操作與輸出</span>
                <div class="flex gap-1 items-center mb-1">
                    <button onclick="duplicateSelected()" class="btn btn-secondary text-xs px-2 py-1" title="複製並貼上 (Ctrl+C / Ctrl+V)">📄 複製</button>
                    <button onclick="bringObjToFront()" class="btn btn-secondary text-xs px-2 py-1" title="移至最上層 (標籤永遠保持最頂)">⬆️ 上層</button>
                    <button onclick="deleteSelected()" class="btn btn-danger text-xs px-2 py-1" title="刪除選取物件">🗑️ 刪除</button>
                </div>
                <button onclick="downloadImage()" class="btn btn-primary text-xs px-3 py-1 w-full">⬇️ 下載最終圖片</button>
            </div>
        </div>
    </header>

    <main class="canvas-container-wrapper" id="canvas-container">
        <div id="tips-box" class="absolute bottom-6 left-6 bg-white/90 backdrop-blur p-4 rounded-lg shadow-lg border border-gray-200 text-sm max-w-xs z-20">
            <button onclick="document.getElementById('tips-box').style.display='none'" class="absolute top-2 right-2 text-gray-400 hover:text-gray-700" title="關閉提示">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h3 class="font-bold mb-2 flex items-center gap-1"><span class="text-xl">💡</span> 操作提示</h3>
            <ul class="list-disc pl-5 space-y-1 text-gray-600">
                <li><b>新增物件：</b>點選工具後，在畫布上<b>「點擊」或「拖曳」</b>。</li>
                <li><b>拖曳複製：</b>按住 <b>Ctrl</b> 鍵並拖曳物件，即可快速複製。</li>
                <li>支援 <b>Ctrl+C</b> 複製、<b>Ctrl+V</b> 貼上，<b>Delete</b> 刪除。</li>
                <li><b>雙擊</b>文字標籤可編輯內容。</li>
                <li>點擊選取物件後，可拖曳移動、<b>旋轉</b>、等比例縮放。</li>
            </ul>
        </div>
        
        <canvas id="plan-canvas"></canvas>
    </main>

    <script>
        let canvas;
        let virtualWidth = 800;  
        let virtualHeight = 900; 
        let labelsLoaded = false;
        
        let placementMode = null;
        let placementData = null;
        let isDrawing = false;
        let startX = 0;
        let startY = 0;
        let currentDrawingObj = null;
        
        let cloneOnDrag = false;
        let originalLeft = 0;
        let originalTop = 0;
        let clipboard = null;

        document.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (placementMode) setMode(null);
                }
                
                const isEditingText = canvas.getActiveObject() && canvas.getActiveObject().isEditing;
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (isEditingText) return; 
                    deleteSelected();
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
                    if (isEditingText) return;
                    copyToClipboard();
                }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V')) {
                    if (isEditingText) return;
                    pasteFromClipboard();
                }
            });
            
            window.addEventListener('resize', () => resizeCanvas());

            document.getElementById('bg-upload').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(f) {
                    loadBackgroundImage(f.target.result);
                };
                reader.readAsDataURL(file);
            });
        });

        function initCanvas() {
            canvas = new fabric.Canvas('plan-canvas', {
                preserveObjectStacking: true,
                selection: true,
                backgroundColor: '#ffffff'
            });

            fabric.Object.prototype.set({
                transparentCorners: false,
                cornerColor: '#3b82f6',
                cornerStrokeColor: '#ffffff',
                borderColor: '#3b82f6',
                cornerSize: 10,
                padding: 5,
                cornerStyle: 'circle'
            });

            canvas.on('mouse:down', function(options) {
                if (!placementMode && options.target && (options.e.ctrlKey || options.e.metaKey)) {
                    if (options.transform && options.transform.action !== 'drag') return;
                    cloneOnDrag = true;
                    originalLeft = options.target.left;
                    originalTop = options.target.top;
                }

                if (!placementMode) return;
                
                const pointer = canvas.getPointer(options.e);
                startX = pointer.x;
                startY = pointer.y;
                const currentZoom = canvas.getZoom() || 1;
                const scale = 1 / currentZoom;

                if (placementMode === 'rect' || placementMode === 'circle' || placementMode === 'text') {
                    isDrawing = true;
                    if (placementMode === 'rect') {
                        currentDrawingObj = new fabric.Rect({
                            left: startX, top: startY, width: 0, height: 0,
                            fill: '#ffffff', originX: 'center', originY: 'center',
                            borderColor: '#9ca3af', cornerColor: '#9ca3af', cornerSize: 8
                        });
                    } else if (placementMode === 'circle') {
                        currentDrawingObj = new fabric.Circle({
                            left: startX, top: startY, radius: 0,
                            fill: '#ffffff', originX: 'center', originY: 'center',
                            borderColor: '#9ca3af', cornerColor: '#9ca3af', cornerSize: 8
                        });
                    } else if (placementMode === 'text') {
                        currentDrawingObj = new fabric.IText('雙擊修改', {
                            left: startX, top: startY,
                            fontFamily: 'Inter, sans-serif', fill: '#000000',
                            fontSize: 24 * scale, fontWeight: 'bold',
                            backgroundColor: 'rgba(255, 255, 255, 0.9)',
                            textAlign: 'center', originX: 'center', originY: 'center',
                            padding: 5 * scale, borderColor: '#8b5cf6', cornerColor: '#8b5cf6',
                            scaleX: 0.1, scaleY: 0.1 
                        });
                    }
                    canvas.add(currentDrawingObj);
                    keepLabelsOnTop();
                } else if (placementMode === 'legend') {
                    placeLegend(startX, startY);
                    setMode(null);
                } else if (placementMode === 'arrow') {
                    // 使用新的 placeArrow 呼叫方式 (傳入 dir 參數)
                    placeArrow(placementData.color, placementData.label, placementData.dir, startX, startY);
                    setMode(null);
                }
            });

            canvas.on('mouse:move', function(options) {
                if (!isDrawing || !currentDrawingObj) return;
                const pointer = canvas.getPointer(options.e);
                const w = Math.abs(pointer.x - startX);
                const h = Math.abs(pointer.y - startY);
                const midX = startX + (pointer.x - startX) / 2;
                const midY = startY + (pointer.y - startY) / 2;

                if (placementMode === 'rect') {
                    currentDrawingObj.set({ width: w, height: h, left: midX, top: midY });
                } else if (placementMode === 'circle') {
                    currentDrawingObj.set({ radius: Math.sqrt(w*w + h*h) / 2, left: midX, top: midY });
                } else if (placementMode === 'text') {
                    const dist = Math.sqrt(w*w + h*h);
                    const newScale = Math.max(0.2, dist / 80); 
                    currentDrawingObj.set({ scaleX: newScale, scaleY: newScale, left: midX, top: midY });
                }
                canvas.renderAll();
            });

            canvas.on('object:moving', function(options) {
                if (cloneOnDrag && options.target) {
                    cloneOnDrag = false; 
                    options.target.clone(function(cloned) {
                        if (cloned.type === 'activeSelection') {
                            cloned.set({ left: originalLeft, top: originalTop });
                            const objs = cloned.getObjects();
                            for(let i = 0; i < objs.length; i++) {
                                let matrix = fabric.util.multiplyTransformMatrices(
                                    cloned.calcTransformMatrix(), 
                                    objs[i].calcTransformMatrix()
                                );
                                let opt = fabric.util.qrDecompose(matrix);
                                objs[i].set({
                                    left: opt.translateX, top: opt.translateY,
                                    scaleX: opt.scaleX, scaleY: opt.scaleY,
                                    angle: opt.angle, skewX: opt.skewX, skewY: opt.skewY,
                                    evented: true
                                });
                                canvas.add(objs[i]);
                            }
                        } else {
                            cloned.set({ left: originalLeft, top: originalTop, evented: true });
                            canvas.add(cloned);
                        }
                        keepLabelsOnTop();
                        canvas.renderAll();
                    });
                }
            });

            canvas.on('mouse:up', function(options) {
                cloneOnDrag = false;
                if (!isDrawing) return;
                isDrawing = false;
                
                if (currentDrawingObj) {
                    const currentZoom = canvas.getZoom() || 1;
                    const scale = 1 / currentZoom;
                    
                    if (placementMode === 'rect' && currentDrawingObj.width < 10 && currentDrawingObj.height < 10) {
                        currentDrawingObj.set({ width: 100 * scale, height: 50 * scale, left: startX, top: startY });
                    } else if (placementMode === 'circle' && currentDrawingObj.radius < 5) {
                        currentDrawingObj.set({ radius: 35 * scale, left: startX, top: startY });
                    } else if (placementMode === 'text' && currentDrawingObj.scaleX < 0.3) {
                        currentDrawingObj.set({ scaleX: 1, scaleY: 1, left: startX, top: startY });
                    }
                    
                    currentDrawingObj.setCoords();
                    canvas.setActiveObject(currentDrawingObj);
                    keepLabelsOnTop();
                    currentDrawingObj = null;
                }
                setMode(null);
            });

            // 預設載入假圖片測試 (或讓使用者自己傳)
            loadBackgroundImage('https://placehold.co/800x900/e2e8f0/475569?text=Please+Upload+Floor+Plan');
        }

        function setMode(mode, data = null) {
            placementMode = mode;
            placementData = data;
            const statusText = document.getElementById('status-text');
            
            if (mode) {
                canvas.defaultCursor = 'crosshair';
                statusText.innerText = '📍 請點擊畫布... (按 Esc 取消)';
                statusText.className = 'text-xs text-orange-600 mt-1 font-bold';
                
                canvas.discardActiveObject();
                canvas.forEachObject(o => { o.selectable = false; o.evented = false; });
                canvas.requestRenderAll();
            } else {
                canvas.defaultCursor = 'default';
                if (labelsLoaded) {
                    statusText.innerText = '✅ 就緒';
                    statusText.className = 'text-xs text-green-600 mt-1 font-bold';
                }
                canvas.forEachObject(o => { o.selectable = true; o.evented = true; });
                canvas.requestRenderAll();
            }
        }

        function keepLabelsOnTop() {
            if (!canvas) return;
            const objs = canvas.getObjects();
            objs.forEach(obj => { if (obj.type === 'group') canvas.bringToFront(obj); });
            objs.forEach(obj => { if (obj.type === 'i-text' || obj.type === 'textbox') canvas.bringToFront(obj); });
        }
        
        function bringObjToFront() {
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                canvas.bringToFront(activeObj);
                keepLabelsOnTop();
                canvas.renderAll();
            }
        }

        function loadBackgroundImage(url) {
            fabric.Image.fromURL(url, function(img) {
                const statusText = document.getElementById('status-text');
                if (!img || img.width === 0) {
                    canvas.setWidth(800);
                    canvas.setHeight(900);
                    if(!labelsLoaded) { loadDefaultLabels(); labelsLoaded = true; }
                    resizeCanvas();
                    return;
                }

                virtualWidth = img.width;
                virtualHeight = img.height;
                
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: 1, scaleY: 1 });
                statusText.innerText = '✅ 底圖載入成功';
                statusText.className = 'text-xs text-green-600 mt-1 font-bold';

                resizeCanvas();
                if (!labelsLoaded) {
                    loadDefaultLabels();
                    labelsLoaded = true;
                }
            }, { crossOrigin: 'anonymous' });
        }

        function resizeCanvas() {
            if (!canvas) return;
            const container = document.getElementById('canvas-container');
            const padding = 40;
            const availableWidth = container.clientWidth - padding;
            const availableHeight = container.clientHeight - padding;
            
            let targetZoom = Math.min(availableWidth / virtualWidth, availableHeight / virtualHeight);
            
            canvas.setDimensions({
                width: virtualWidth * targetZoom,
                height: virtualHeight * targetZoom
            });
            canvas.setZoom(targetZoom);
        }

        function loadDefaultLabels() {
            const fontScale = virtualWidth / 800;
            const defaultLabels = [
                { text: "Warehouse\n倉庫\n(W-03)", left: virtualWidth * 0.42, top: virtualHeight * 0.58, fontSize: 16 * fontScale }
            ];

            defaultLabels.forEach(labelData => {
                const text = new fabric.IText(labelData.text, {
                    left: labelData.left, top: labelData.top,
                    fontFamily: 'Inter, sans-serif', fill: '#1f2937',
                    fontSize: labelData.fontSize, fontWeight: 'bold',
                    backgroundColor: 'rgba(255, 255, 255, 0.7)',
                    textAlign: 'center', originX: 'center', originY: 'center',
                    padding: 4, borderColor: '#f59e0b', cornerColor: '#f59e0b'
                });
                canvas.add(text);
            });
            
            placeLegend(virtualWidth * 0.15, virtualHeight * 0.85, true);
            canvas.renderAll();
        }

        function placeLegend(x, y, isInit = false) {
            const scale = 1 / (canvas.getZoom() || 1);
            const legendText = "【圖例 Legend】\nP : 人流 (Personnel Flow)\nM : 物流 (Material Flow)\nW : 廢棄物流 (Waste Flow)";
            
            const textStyles = {
                1: {}, 2: {}, 3: {}
            };
            for (let i = 0; i < 50; i++) {
                textStyles[1][i] = { fill: '#2563eb' }; 
                textStyles[2][i] = { fill: '#16a34a' }; 
                textStyles[3][i] = { fill: '#dc2626' }; 
            }

            const textbox = new fabric.Textbox(legendText, {
                left: x, top: y, width: 260 * scale,
                fontSize: 16 * scale, fontFamily: 'Inter, sans-serif', fill: '#1f2937',
                backgroundColor: 'rgba(255, 255, 255, 0.95)',
                borderColor: '#6b7280', cornerColor: '#6b7280',
                padding: 10 * scale, lineHeight: 1.5, fontWeight: 'bold',
                originX: 'center', originY: 'center', styles: textStyles
            });

            textbox.set('shadow', new fabric.Shadow({
                color: 'rgba(0,0,0,0.2)', blur: 8 * scale, offsetX: 3 * scale, offsetY: 3 * scale
            }));
            
            canvas.add(textbox);
            keepLabelsOnTop();
            if (!isInit) canvas.setActiveObject(textbox);
            canvas.renderAll();
        }

        function placeArrow(color, labelText, direction, x, y) {
            const scale = 1 / (canvas.getZoom() || 1);
            const length = 120 * scale;
            const thickness = 6 * scale;
            const arrowHeadSize = 22 * scale;
            
            let linePts = [];
            let textLeft = 0;
            let textTop = 0;

            // 判斷線條是橫向還是直向，並決定文字偏移量
            if (direction === 'right' || direction === 'left' || direction === 'double-h') {
                linePts = [-length/2, 0, length/2, 0];
                textTop = -24 * scale; // 橫向箭頭，文字放在上方
                textLeft = 0;
            } else {
                linePts = [0, -length/2, 0, length/2];
                textTop = 0;
                textLeft = 24 * scale; // 直向箭頭，文字放在右側，避免擋住線條
            }

            const objects = [];

            // 1. 繪製主線條
            const line = new fabric.Line(linePts, {
                stroke: color, strokeWidth: thickness,
                originX: 'center', originY: 'center', selectable: false
            });
            objects.push(line);

            // 輔助函數：建立三角形箭頭
            const createTri = (left, top, angle) => {
                return new fabric.Triangle({
                    width: arrowHeadSize, height: arrowHeadSize + 5 * scale,
                    fill: color, left: left, top: top,
                    originX: 'center', originY: 'center', angle: angle, selectable: false
                });
            };

            // 2. 根據方向補上三角形
            if (direction === 'right' || direction === 'double-h') {
                objects.push(createTri(length/2, 0, 90));
            }
            if (direction === 'left' || direction === 'double-h') {
                objects.push(createTri(-length/2, 0, -90));
            }
            if (direction === 'down' || direction === 'double-v') {
                objects.push(createTri(0, length/2, 180));
            }
            if (direction === 'up' || direction === 'double-v') {
                objects.push(createTri(0, -length/2, 0));
            }

            // 3. 繪製永遠保持水平的文字
            const text = new fabric.Text(labelText, {
                fontSize: 18 * scale, fontWeight: 'bold', fill: '#ffffff',
                backgroundColor: color, originX: 'center', originY: 'center',
                left: textLeft, top: textTop, selectable: false, padding: 4 * scale
            });
            objects.push(text);

            // 4. 打包成群組
            const group = new fabric.Group(objects, {
                left: x, top: y, originX: 'center', originY: 'center',
                borderColor: color, cornerColor: color, transparentCorners: false,
                // 恢復群組的旋轉能力
                hasRotatingPoint: true 
            });

            // 隱藏不必要的拉伸控制點，但保留旋轉控制點 (mtr) 與四角等比例縮放
            group.setControlsVisibility({
                mt: false, mb: false, ml: false, mr: false
            });

            canvas.add(group);
            keepLabelsOnTop();
            canvas.setActiveObject(group);
            canvas.renderAll();
        }

        function deleteSelected() {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach(obj => canvas.remove(obj));
            }
        }

        function copyToClipboard() {
            const activeObject = canvas.getActiveObject();
            if (!activeObject) return;
            activeObject.clone(cloned => clipboard = cloned);
        }

        function pasteFromClipboard() {
            if (!clipboard) return;
            clipboard.clone(function(clonedObj) {
                canvas.discardActiveObject();
                clonedObj.set({ left: clonedObj.left + 30, top: clonedObj.top + 30, evented: true });
                
                if (clonedObj.type === 'activeSelection') {
                    clonedObj.canvas = canvas;
                    clonedObj.forEachObject(obj => canvas.add(obj));
                    clonedObj.setCoords();
                } else {
                    canvas.add(clonedObj);
                }
                
                clipboard.top += 30;
                clipboard.left += 30;
                
                keepLabelsOnTop();
                canvas.setActiveObject(clonedObj);
                canvas.renderAll();
            });
        }

        function duplicateSelected() {
            copyToClipboard();
            setTimeout(pasteFromClipboard, 50); 
        }

        function downloadImage() {
            if (!canvas) return;
            canvas.discardActiveObject();
            canvas.renderAll();

            const currentZoom = canvas.getZoom();
            const currentWidth = canvas.getWidth();
            const currentHeight = canvas.getHeight();
            const vpt = canvas.viewportTransform;
            
            canvas.setZoom(1);
            canvas.setWidth(virtualWidth);
            canvas.setHeight(virtualHeight);
            canvas.viewportTransform = [1,0,0,1,0,0];
            
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 1 });
            
            canvas.setWidth(currentWidth);
            canvas.setHeight(currentHeight);
            canvas.setZoom(currentZoom);
            canvas.viewportTransform = vpt;
            canvas.renderAll();
            
            const link = document.createElement('a');
            link.download = 'floor_plan_arrows.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
